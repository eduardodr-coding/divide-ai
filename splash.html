<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fdf6ec" />
  <title>Divide aí</title>
  <style>
    :root {
      --bg: #fdf6ec;
      --green: #2b6a35;
      --green-soft: #3c8a45;
      --orange: #f08c35;
      --border: #a9d3a1;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #e9e4da;
      display: flex; justify-content: center; align-items: center;
      color: var(--green);
    }
    .app {
      position: relative; overflow: hidden;
      width: 100%; max-width: 390px; height: 100dvh; max-height: 844px;
      background: var(--bg);
    }
    @media (min-width: 440px) { .app { border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.18); } }

    /* ===== Splash (versão ~35% mais rápida que a original) ===== */
    .splash {
      position: absolute; inset: 0; z-index: 2; background: var(--bg);
      display: grid; place-items: center;
      transition: opacity .4s ease, visibility .4s;
    }
    .splash.hide { opacity: 0; visibility: hidden; }
    .splash.hide .splash-logo { transform: scale(1.12); transition: transform .4s ease; }

    .glow {
      position: absolute; width: 420px; height: 420px; border-radius: 50%;
      background: radial-gradient(circle, rgba(240,140,53,.22), rgba(170,211,161,.18) 45%, transparent 70%);
      opacity: 0; transform: scale(.4);
      animation: glow .7s ease-out .03s forwards;
    }
    .ring {
      position: absolute; width: 180px; height: 180px; border-radius: 50%;
      border: 2px solid rgba(60,138,69,.35); opacity: 0; transform: scale(.3);
      animation: ring .8s ease-out forwards;
    }
    .r1 { animation-delay: .13s; }
    .r2 { animation-delay: .33s; }

    .splash-logo { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; width: 72%; }
    .splash-logo img { display: block; height: auto; }
    .l-icon { width: 46%; }
    .l-word { width: 100%; }
    .l-tag { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
    .l-tag img:first-child { width: 69%; }
    .l-tag img:last-child { width: 56%; }

    .l-icon {
      opacity: 0; transform: scale(.2) rotate(-25deg); transform-origin: 50% 55%;
      animation: icon .45s cubic-bezier(.34,1.56,.64,1) .1s forwards,
                 float 1.6s ease-in-out .6s infinite;
    }
    .l-word {
      opacity: 0; clip-path: inset(0 100% 0 0); transform: translateY(16px);
      animation: word .4s cubic-bezier(.2,.8,.2,1) .4s forwards;
    }
    .l-tag {
      opacity: 0; transform: translateY(14px);
      animation: tag .33s ease-out .65s forwards;
    }

    @keyframes icon  { 60% { opacity: 1; } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes float { 50% { transform: translateY(-6px) scale(1.02); } }
    @keyframes word  { to { opacity: 1; clip-path: inset(0 0 0 0); transform: none; } }
    @keyframes tag   { to { opacity: 1; transform: none; } }
    @keyframes glow  { to { opacity: 1; transform: scale(1); } }
    @keyframes ring  { 20% { opacity: .8; } to { opacity: 0; transform: scale(3.2); } }

    /* ===== Tela seguinte (login) ===== */
    .login { position: absolute; inset: 0; opacity: 0; transition: opacity .4s ease; overflow-y: auto; }
    .login.show { opacity: 1; }
  </style>
</head>

      <div class="ring r1"></div><div class="ring r2"></div>
